# Builds Saturn Miner installers for Windows, macOS (Apple silicon + Intel) and Linux,
# and attaches them to a draft GitHub Release.
#
# Release a new version:
#   1. bump "version" in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml
#   2. git tag v0.2.0 && git push origin v0.2.0
#   3. wait for the 4 jobs to finish, then open Releases on GitHub and press "Publish release"
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple silicon (M1 and newer)
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel Macs
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04 # .deb, .rpm and .AppImage
            args: ''
          - platform: windows-latest # .msi and setup .exe
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v4 # uses the pnpm version from package.json "packageManager"

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional macOS signing + notarisation. Without these the Mac build still works,
          # but users have to right-click → Open the first time. Add them as repo secrets when you have
          # an Apple Developer account:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Saturn Miner v__VERSION__'
          releaseBody: |
            Download the installer for your computer:
            - **Windows**: the `.msi` or `-setup.exe`
            - **Mac (M1/M2/M3/M4)**: the `aarch64.dmg`
            - **Mac (Intel)**: the `x64.dmg`
            - **Linux**: the `.AppImage` (any distro), `.deb` (Ubuntu/Debian) or `.rpm` (Fedora)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
