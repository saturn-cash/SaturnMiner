[package]
name = "saturn-miner"
version = "0.2.0"
description = "Saturn Miner: desktop miner and Bitaxe controller for Saturn Core"
edition = "2021"
rust-version = "1.77"

[lib]
name = "saturn_miner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
local-ip-address = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
